name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run check
      - run: npm run e2e:local
      - run: git diff --exit-code -- openclaw.plugin.json src/version.ts dist
